<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: linear-gradient(160deg, #f2f7ee 0%, #e2efdb 55%, #d3e7c8 100%);

    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;

  .domain { color: #6a8f71; font-size: 15px; letter-spacing: 2px; }
  .line { width: 56px; height: 3px; background: #8fbf94; border-radius: 2px; margin: 26px auto; }
  p { font-size: 17px; line-height: 1.9; color: #43584a; }
  .footer { margin-top: 34px; font-size: 13px; color: #93a897; }

</head>
<body>
  <div class="card">
